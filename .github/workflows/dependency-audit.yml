name: Dependency Audit & Snyk Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v3

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # أو عدّله بما يناسب المشروع

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Run npm audit (Security check)
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate || true

      - name: 🧓 Check outdated dependencies
        run: |
          echo "Checking for outdated packages..."
          npm outdated || true

      - name: 🛡️ Run Snyk Code Scan (SARIF output)
        run: snyk code test --sarif > snyk-code.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: 🗂️ Upload SARIF to GitHub Security Dashboard
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: snyk-code.sarif

      - name: 🗃️ Upload raw SARIF as artifact (optional)
        uses: actions/upload-artifact@v3
        with:
          name: snyk-code-results
          path: snyk-code.sarif
