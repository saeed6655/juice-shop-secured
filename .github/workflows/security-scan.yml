name: Juice Shop Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=low || true

      - name: Run ESLint (Code Quality & Vulnerability hints)
        run: |
          npm install eslint
          npx eslint . || true

      - name: Run Gitleaks (Secret Scanner)
        uses: gitleaks/gitleaks-action@v2
