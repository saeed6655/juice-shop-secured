name: Secure CI Pipeline (Juice Shop)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4

    - name: 🧰 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ---------- تثبيت التبعيات ----------
    - name: 📦 Clean install root dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install --legacy-peer-deps

    - name: 📦 Clean install frontend dependencies
      working-directory: ./frontend
      run: |
        rm -rf node_modules package-lock.json
        npm install --legacy-peer-deps

    # ---------- فحصات NPM ----------
    - name: 🔐 Run npm audit (root)
      run: npm audit --audit-level=low
      continue-on-error: true

    - name: 🧓 Check outdated dependencies (root)
      run: npm outdated || true

    # ---------- فحصات Linters ----------
    - name: 🧹 Run ESLint
      run: npx eslint . || true

    # ---------- فحص الأسرار ----------
    - name: 🔑 Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        fail: false

    # ---------- فحص Semgrep ----------
    - name: 🔍 Run Semgrep Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: "p/javascript"

    # ---------- فحص OWASP JS اليدوي ----------
    - name: 🔎 Detect OWASP JS Issues (js-xss)
      run: |
        npm install -g js-xss
        grep -r --include \*.js "innerHTML\|document.write\|eval\|Function(" . || true

    # ---------- إعداد Snyk ----------
    - name: 🛠️ Set up Snyk CLI
      uses: snyk/actions/setup@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    # ---------- فحص Snyk Code ----------
    - name: 🧠 Snyk Code (static analysis)
      run: snyk code test --sarif > snyk-code.sarif
      continue-on-error: true

    - name: 📤 Upload Snyk SARIF to GitHub Security Dashboard
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk-code.sarif

    - name: 🗃️ Save Snyk SARIF as artifact
      uses: actions/upload-artifact@v3
      with:
        name: snyk-code-results
        path: snyk-code.sarif

    # ---------- فحص Snyk للتبعيات ----------
    - name: 🧪 Snyk Open Source - Root
      run: snyk test --all-projects --detection-depth=3 --print-deps
      continue-on-error: true

    - name: 📈 Snyk Monitor - Root & Frontend
      run: |
        snyk monitor --all-projects --detection-depth=3 --print-deps
        cd frontend && snyk monitor --print-deps
      continue-on-error: true

    # ---------- فحص الحاوية ----------
    - name: 🐳 Build Docker image
      run: docker build -t juice-shop-secured .

    - name: 🛡️ Snyk Container Monitor
      run: snyk container monitor juice-shop-secured --file=Dockerfile
      continue-on-error: true

    # ---------- فحص IaC ----------
    - name: ⚙️ Snyk IaC test (optional)
      run: snyk iac test
      continue-on-error: true
