name: Secure CI Pipeline (Juice Shop)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    # ---------- أدوات فحص الأمان ----------
    - name: Run npm audit
      run: npm audit --audit-level=low

    - name: Run ESLint
      run: npx eslint . || true

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        config-path: ""
        fail: false

    - name: Run Semgrep Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: "p/javascript"

    - name: Detect OWASP Issues in JS (js-xss)
      run: |
        npm install -g js-xss
        grep -r --include \*.js "innerHTML\|document.write\|eval\|Function(" . || true

    # ---------- إعداد واستخدام Snyk ----------
    - name: Set up Snyk CLI
      uses: snyk/actions/setup@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    # فحص الكود باستخدام Snyk Code وتحميل التقرير
    - name: Snyk Code test
      run: snyk code test --sarif > snyk-code.sarif || true

    - name: Upload Snyk Code results to GitHub
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk-code.sarif

    # فحص التبعيات
    - name: Snyk Open Source monitor
      run: snyk monitor --all-projects || true

    # فحص IaC
    - name: Snyk IaC test and report
      run: snyk iac test --report || true

    # فحص الحاويات
    - name: Build a Docker image
      run: docker build -t juice-shop-secured .

    - name: Snyk Container monitor
      run: snyk container monitor juice-shop-secured --file=Dockerfile || true
